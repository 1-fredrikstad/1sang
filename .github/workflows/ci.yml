name: CI Pipeline

on:
 push:
  branches: [main, dev]
 pull_request:
  branches: [main, dev]
 workflow_dispatch:

permissions:
 contents: read

jobs:
 ci:
  runs-on: ubuntu-latest
  steps:
   # Checkout repo
   - name: Checkout repository
     uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

   # Install pnpm
   - name: Install pnpm
     uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
     with:
      version: 10.7.0

   # Setup Node.js
   - name: Setup Node.js
     uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
     with:
      node-version: 24
      cache: "pnpm"

   # Install project dependencies
   - name: Install dependencies
     run: pnpm install --frozen-lockfile

   # Check for known vulnerabilities
   - name: Security audit
     run: pnpm audit --audit-level=high

   # Lint all packages that have lint scripts
   - name: Lint
     working-directory: frontend
     run: pnpm run lint # continues even if some packages have no lint script

   # Run Prettier check
   - name: Prettier
     working-directory: frontend
     run: pnpm run format:check

   # Test all packages that have test scripts
   - name: Test
     run: pnpm -r test

   # Build frontend
   - name: Build frontend
     working-directory: frontend
     run: pnpm build
