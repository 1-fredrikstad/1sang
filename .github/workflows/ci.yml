name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Node.js and enable pnpm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Install pnpm package manager
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Install dependencies using frozen lockfile (fast + reproducible builds)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run linting (checks code quality and catches errors early)
      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      # Run Prettier / formatting check (ensures consistent code style)
      - name: Prettier check
        working-directory: frontend
        run: pnpm run format:check

      # Run all tests in the repo (unit/integration tests)
      - name: Test
        run: pnpm -r test

      # Build frontend for production (verifies build succeeds)
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
