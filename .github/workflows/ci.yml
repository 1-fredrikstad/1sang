name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository code
      - uses: actions/checkout@v4

      # Set up Node.js and enable built-in pnpm dependency caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Install pnpm package manager
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Install dependencies using lockfile for consistency and speed
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run linting to catch code issues and enforce style rules
      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      # Run formatting check (e.g. Prettier) to ensure consistent code style
      - name: Format check
        working-directory: frontend
        run: pnpm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository code
      - uses: actions/checkout@v4

      # Set up Node.js with pnpm caching enabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Install pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Install dependencies from lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Run all tests across the monorepo
      - name: Run tests
        run: pnpm -r test

  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout repository code
      - uses: actions/checkout@v4

      # Set up Node.js with pnpm caching enabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # Install pnpm package manager
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Install dependencies from lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the frontend for production
      - name: Build frontend
        working-directory: frontend
        run: pnpm build
